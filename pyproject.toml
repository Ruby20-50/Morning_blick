[project]
name = "morning-blick"
version = "0.1.0"
description = "Morning Blick: a FastAPI app for a daily morning overview"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
        "fastapi>=0.115.12",
        "jinja2>=3.1.6",
        "nylas==6.9.0",
        "pydantic>=2.11.4",
        "python-dotenv>=1.1.0",
        "uvicorn>=0.34.2",
]

[project.scripts]
morning-blick = "app.main:main"

[dependency-groups]
dev = [
        "httpx2",
        "ipykernel>=7.4.0",
        "pytest>=8.3.5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "references/**/*", "reports/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
